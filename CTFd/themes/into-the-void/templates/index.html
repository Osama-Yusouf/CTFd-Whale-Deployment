<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Into The Void 2.0 — CTFd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root{
    --void:#0a0a12;
    --void-deep:#050508;
    --panel:#12121e;
    --portal-violet:#7c5cff;
    --rift-magenta:#ff3d8a;
    --quantum-blue:#3dc7ff;
    --singularity-amber:#ffb238;
    --text-hi:#f3f1fb;
    --text-mid:#9a94b8;
    --text-dim:#5c5878;
    --line:rgba(255,255,255,0.08);
  }

  .itv-wrap{
    position:relative;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(124,92,255,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 90%, rgba(255,61,138,0.10), transparent 60%),
      var(--void-deep);
    color:var(--text-hi);
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
    padding:0;
  }

  /* faint dimensional grid — no scan/matrix rain, just a static fractured lattice */
  .itv-lattice{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 30%, black, transparent 75%);
    mask-image:radial-gradient(ellipse 60% 50% at 50% 30%, black, transparent 75%);
    opacity:0.5;
    pointer-events:none;
  }

  .itv-container{
    position:relative;
    z-index:2;
    max-width:640px;
    margin:0 auto;
    padding:9vh 24px 8vh;
    text-align:center;
  }

  /* ---------- portal / signature element ---------- */
  .itv-portal{
    position:relative;
    width:340px; height:340px;
    margin:0 auto 28px;
    display:flex; align-items:center; justify-content:center;
  }
  .itv-ring{
    position:absolute;
    border-radius:50%;
    border:1.5px solid transparent;
  }
  .itv-ring--1{
    inset:0;
    border-top-color:var(--portal-violet);
    border-right-color:rgba(124,92,255,0.25);
    animation:itv-spin 14s linear infinite;
  }
  .itv-ring--2{
    inset:34px;
    border-top-color:var(--rift-magenta);
    border-left-color:rgba(255,61,138,0.25);
    animation:itv-spin-rev 10s linear infinite;
  }
  .itv-ring--3{
    inset:68px;
    border-top-color:var(--quantum-blue);
    border-right-color:rgba(61,199,255,0.25);
    animation:itv-spin 7s linear infinite;
  }
  .itv-ring--4{
    inset:102px;
    border-top-color:var(--singularity-amber);
    border-left-color:rgba(255,178,56,0.25);
    animation:itv-spin-rev 18s linear infinite;
  }
  @keyframes itv-spin{ to{ transform:rotate(360deg); } }
  @keyframes itv-spin-rev{ to{ transform:rotate(-360deg); } }

  .itv-logo{
    position:relative;
    z-index:3;
    width:100px;
    filter:drop-shadow(0 0 22px rgba(124,92,255,0.45));
  }

  /* ---------- headline / glitch ---------- */
  .itv-eyebrow{
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--quantum-blue);
    margin-bottom:14px;
  }

  .itv-title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:clamp(30px, 5vw, 46px);
    line-height:1.05;
    letter-spacing:0.01em;
    margin:0 0 10px;
    position:relative;
    display:inline-block;
    color:var(--text-hi);
  }
  .itv-title:hover{ cursor:default; }
  .itv-title::before,
  .itv-title::after{
    content:attr(data-text);
    position:absolute; left:0; top:0;
    width:100%; height:100%;
    opacity:0;
  }
  .itv-title:hover::before{
    color:var(--rift-magenta);
    opacity:0.7;
    animation:itv-glitch-1 0.5s steps(2,end) infinite;
  }
  .itv-title:hover::after{
    color:var(--quantum-blue);
    opacity:0.7;
    animation:itv-glitch-2 0.5s steps(2,end) infinite;
  }
  @keyframes itv-glitch-1{
    0%{ transform:translate(0,0); clip-path:inset(0 0 70% 0); }
    50%{ transform:translate(-3px,1px); clip-path:inset(30% 0 40% 0); }
    100%{ transform:translate(2px,-1px); clip-path:inset(60% 0 10% 0); }
  }
  @keyframes itv-glitch-2{
    0%{ transform:translate(0,0); clip-path:inset(60% 0 10% 0); }
    50%{ transform:translate(3px,-1px); clip-path:inset(10% 0 60% 0); }
    100%{ transform:translate(-2px,1px); clip-path:inset(40% 0 30% 0); }
  }

  .itv-subtitle{
    font-family:'Chakra Petch', sans-serif;
    font-weight:500;
    font-size:16px;
    letter-spacing:0.06em;
    color:var(--text-mid);
    margin:0 0 6px;
  }
  .itv-subtitle span{ color:var(--portal-violet); }

  .itv-tagline{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 40px;
  }
  .itv-tagline a{
    color:var(--text-mid);
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-color:var(--line);
  }
  .itv-tagline a:hover{ color:var(--quantum-blue); text-decoration-color:var(--quantum-blue); }

  /* ---------- dimension shards (social links) ---------- */
  .itv-shards{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:0 0 48px;
  }
  .itv-shard{
    width:46px; height:46px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
    border:1px solid var(--line);
    clip-path:polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
    color:var(--text-mid);
    transition:transform .25s ease, color .25s ease, border-color .25s ease;
  }
  .itv-shard:hover{
    transform:translateY(-4px);
    color:var(--void-deep);
  }
  .itv-shard--1:hover{ background:var(--portal-violet); border-color:var(--portal-violet); }
  .itv-shard--2:hover{ background:var(--rift-magenta); border-color:var(--rift-magenta); }
  .itv-shard--3:hover{ background:var(--quantum-blue); border-color:var(--quantum-blue); }

  /* ---------- entry point ---------- */
  .itv-entry{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 30px;
    background:linear-gradient(90deg, var(--portal-violet), var(--rift-magenta));
    color:var(--text-hi);
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 12px 30px -10px rgba(124,92,255,0.5);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .itv-entry:hover{
    transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(255,255,255,0.15), 0 16px 34px -8px rgba(255,61,138,0.55);
    color:var(--text-hi);
  }
  .itv-entry::after{ content:"→"; transition:transform .2s ease; }
  .itv-entry:hover::after{ transform:translateX(3px); }

  .itv-footnote{
    margin-top:20px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  /* ---------- new timer panels ---------- */
  .itv-timer-grid {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin: 28px 0 32px;
    width: 100%;
  }

  .itv-timer-panel {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(18, 18, 30, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(124, 92, 255, 0.25);
    border-radius: 12px;
    padding: 18px 8px 14px;
    box-shadow: 0 0 28px -4px rgba(124, 92, 255, 0.15);
    transition: box-shadow 0.2s;
    text-align: center;
  }

  .itv-timer-panel:hover {
    box-shadow: 0 0 34px -2px rgba(124, 92, 255, 0.25);
  }

  .itv-timer-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .itv-timer-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 1.7rem;
    line-height: 1.2;
    color: var(--text-hi);
    text-shadow: 0 0 18px rgba(124, 92, 255, 0.3);
    letter-spacing: 0.06em;
    transition: color 0.3s;
  }

  .itv-timer-value.ended {
    color: var(--rift-magenta);
    text-shadow: 0 0 28px rgba(255, 61, 138, 0.5);
  }

  @media (max-width: 640px) {
    .itv-timer-grid {
      flex-direction: column;
      gap: 14px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    .itv-timer-panel {
      padding: 14px 8px 12px;
    }
    .itv-timer-value {
      font-size: 1.4rem;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .itv-ring{ animation:none; }
    .itv-title:hover::before, .itv-title:hover::after{ animation:none; opacity:0; }
  }

  @media (max-width:480px){
    .itv-portal{ width:250px; height:250px; }
    .itv-ring--2{ inset:26px; }
    .itv-ring--3{ inset:50px; }
    .itv-ring--4{ inset:74px; }
    .itv-logo{ width:85px; }
  }
</style>
</head>
<body>
<div class="itv-wrap">
  <div class="itv-lattice"></div>

  <div class="itv-container">

    <div class="itv-portal">
      <div class="itv-ring itv-ring--1"></div>
      <div class="itv-ring itv-ring--2"></div>
      <div class="itv-ring itv-ring--3"></div>
      <div class="itv-ring itv-ring--4"></div>
      <img class="itv-logo" src="https://podu.pics/t7n5YaLpBl" alt="ExploitX" />
    </div>

    <div class="itv-eyebrow">Season 02 · Signal Detected</div>

    <h1 class="itv-title" data-text="INTO THE VOID 2.0">INTO THE VOID 2.0</h1>
    <p class="itv-subtitle">Multiverse of <span>The Matrix</span></p>
    <p class="itv-tagline">A CTF platform built on <a href="https://ctfd.io" target="_blank" rel="noopener">CTFd</a> — hosted by Team <a href="https://exploitx.org" target="_blank" rel="noopener">ExploitX</a></p>

    <!-- TIMER ROW: LIVE CLOCK + PORTAL COLLAPSE -->
    <div class="itv-timer-grid">
      <div class="itv-timer-panel">
        <div class="itv-timer-label">⏳ current time</div>
        <div class="itv-timer-value" id="liveClock">--:--:--</div>
      </div>
      <div class="itv-timer-panel">
        <div class="itv-timer-label">🌀 portal collapse</div>
        <div class="itv-timer-value" id="countdownDisplay">--:--:--</div>
      </div>
    </div>

    <div class="itv-shards">
      <a class="itv-shard itv-shard--1" href="https://www.linkedin.com/company/exploitxorg/" target="_blank" rel="noopener" aria-label="Linkedin">
        <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
      </a>
      <a class="itv-shard itv-shard--2" href="https://www.instagram.com/exploitxorg" target="_blank" rel="noopener" aria-label="Facebook">
        <i class="fab fa-instagram" aria-hidden="true"></i>
      </a>
      <a class="itv-shard itv-shard--3" href="https://twitter.com/exploitxorg" target="_blank" rel="noopener" aria-label="X">
        <i class="fab fa-x-twitter" aria-hidden="true"></i>
      </a>
      <a class="itv-shard itv-shard--3" href="https://mastodon.social/@exploitxorg" target="_blank" rel="noopener" aria-label="X">
        <i class="fab fa-mastodon" aria-hidden="true"></i>
      </a>
      <a class="itv-shard itv-shard--1" href="http://exploitx.org/" target="_blank" rel="noopener" aria-label="Web">
        <i class="fa-solid fa-globe" aria-hidden="true"></i>
      </a>
    </div>

    <a class="itv-entry" href="challenges">Enter the Multiverse</a>
    <div class="itv-footnote">Login to configure your CTF</div>

  </div>
</div>

<script>
  (function() {
    "use strict";

    const clockEl = document.getElementById('liveClock');
    const countdownEl = document.getElementById('countdownDisplay');

    // ----- target: today 21:00:00 local -----
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 21, 0, 0, 0);
    let ended = false;

    // ----- helpers -----
    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function formatHMS(date) {
      return pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
    }

    function updateClock() {
      const d = new Date();
      clockEl.textContent = formatHMS(d);
    }

    function updateCountdown() {
      if (ended) return;

      const now = new Date();
      const diff = target - now;

      if (diff <= 0) {
        ended = true;
        countdownEl.textContent = 'EVENT ENDED';
        countdownEl.classList.add('ended');
        return;
      }

      const seconds = Math.floor(diff / 1000);
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      countdownEl.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
      countdownEl.classList.remove('ended');
    }

    // ----- tick every second -----
    function tick() {
      updateClock();
      updateCountdown();
    }

    // initial render
    tick();

    // single interval
    setInterval(tick, 1000);

  })();
</script>
</body>
</html>
